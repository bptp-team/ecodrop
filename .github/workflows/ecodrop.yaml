name: ecodrop

on:
  push:
  pull_request:

# EcoDrop's registry, created by terraform/main.tf. Keep these values here: the
# organization-level ACR_NAME and ACR_LOGIN_SERVER variables point to another registry.
env:
  REGISTRY: ecodropacr
  IMAGE: ecodropacr.azurecr.io/ecodrop

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make lint
      - run: make format-check

  tests:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make test

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make build

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ECODROP_CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Basic registries can't lock tags, so pushing an existing version would overwrite it.
      # The step passes only when the tag is not found in the registry.
      - name: Refuse a version that already exists
        run: '! az acr repository show --name ${{ env.REGISTRY }} --image ecodrop:${{ github.ref_name }} --output none'

      - name: Sign in to the registry
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ECODROP_CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The resource names come from terraform/main.tf.
      - name: Deploy ${{ env.IMAGE }}:${{ github.ref_name }}
        run: >-
          az containerapp update
          --resource-group ecodrop-rg
          --name ecodrop
          --image ${{ env.IMAGE }}:${{ github.ref_name }}
          --output none

      # The retries cover the few seconds a scaled-to-zero app takes to start.
      - name: Verify the site answers in production
        run: >-
          curl --fail --silent --show-error --max-time 30
          --retry 5 --retry-delay 5 --retry-all-errors
          https://ecodrop.thomaspalma.com.br/healthz
